<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>食品在庫管理ツール</title>
    <style>
        :root {
            --blue: #2563eb;
            --red: #ef4444;
            --border: #e5e7eb;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --bg: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f9fafb; color: var(--text-main); }
        .app-container { max-width: 600px; margin: 0 auto; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* 共通ボタンスタイル */
        button { border: none; border-radius: 8px; padding: 12px; font-weight: bold; font-size: 14px; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .btn-blue { background-color: var(--blue); }
        .btn-red { background-color: var(--red); }
        
        /* TOP画面 */
        #list-view { padding: 16px; }
        .action-buttons { display: flex; gap: 12px; margin-bottom: 20px; }
        .action-buttons button:first-child { flex: 1; }
        .action-buttons button:last-child { flex: 2; }
        
        .list-header, .list-item { display: flex; align-items: center; padding: 16px 8px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .list-header { font-weight: bold; border-bottom: 2px solid var(--border); background-color: var(--bg); position: sticky; top: 0; }
        .col-name { flex: 2; word-break: break-all; padding-right: 8px; }
        .col-exp { flex: 1.5; text-align: center; }
        .col-reg { flex: 1.5; text-align: center; }
        .col-check { flex: 0.5; text-align: right; display: flex; justify-content: flex-end; }
        
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--blue); }
        
        /* 登録画面 */
        #register-view { padding: 16px; display: none; }
        .header-nav { margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
        .btn-submit { width: 100%; margin-top: 16px; padding: 16px; font-size: 16px; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- TOP画面（リスト表示） -->
    <div id="list-view">
        <div class="action-buttons">
            <button class="btn-blue" onclick="toggleView('register-view')">＋ 登録</button>
            <button class="btn-red" onclick="deleteSelected()">🗑 チェックした食品を削除</button>
        </div>
        
        <div class="list-header">
            <div class="col-name">品名</div>
            <div class="col-exp">賞味期限</div>
            <div class="col-reg">登録日</div>
            <div class="col-check"></div>
        </div>
        <div id="item-list">
            <!-- JavaScriptでリストを生成 -->
        </div>
    </div>

    <!-- 登録画面 -->
    <div id="register-view">
        <div class="header-nav">
            <button class="btn-blue" style="width: auto; padding: 8px 16px;" onclick="toggleView('list-view')">＜ 戻る</button>
        </div>
        
        <div class="form-group">
            <label for="input-name">品名</label>
            <!-- list属性を追加し、datalistと紐付け。autocomplete="off"で余計なOS履歴を抑制 -->
            <input type="text" id="input-name" placeholder="例: 牛乳" list="name-history" autocomplete="off">
            <datalist id="name-history">
                <!-- JavaScriptで履歴を生成 -->
            </datalist>
        </div>
        <div class="form-group">
            <label for="input-exp">賞味期限（任意）</label>
            <input type="date" id="input-exp">
        </div>
        
        <button class="btn-blue btn-submit" onclick="registerItem()">登録する</button>
    </div>
</div>

<script>
    // ローカルストレージキー
    const STORAGE_KEY = 'food_inventory_db';
    const HISTORY_KEY = 'food_name_history'; // 品名履歴用のキーを追加

    // --- データの読み書き関数 ---
    function loadData() {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function loadNameHistory() {
        const data = localStorage.getItem(HISTORY_KEY);
        return data ? JSON.parse(data) : [];
    }

    // 品名を履歴に保存（重複なし）
    function saveNameHistory(name) {
        let history = loadNameHistory();
        if (!history.includes(name)) {
            history.push(name);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            updateDatalist(); // 履歴リストを更新
        }
    }

    // 今日の日付を取得
    function getTodayString() {
        const today = new Date();
        const y = today.getFullYear();
        const m = String(today.getMonth() + 1).padStart(2, '0');
        const d = String(today.getDate()).padStart(2, '0');
        return `${y}/${m}/${d}`;
    }

    // 画面の切り替え
    function toggleView(viewId) {
        document.getElementById('list-view').style.display = viewId === 'list-view' ? 'block' : 'none';
        document.getElementById('register-view').style.display = viewId === 'register-view' ? 'block' : 'none';
        if (viewId === 'list-view') renderList();
    }

    // 履歴データからdatalist（入力候補）を生成
    function updateDatalist() {
        const datalist = document.getElementById('name-history');
        datalist.innerHTML = '';
        const history = loadNameHistory();
        
        // 五十音順などで見やすくソート
        history.sort();

        history.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            datalist.appendChild(option);
        });
    }

    // リストの描画とソート
    function renderList() {
        const listContainer = document.getElementById('item-list');
        listContainer.innerHTML = '';
        const items = loadData();

        items.sort((a, b) => {
            const expA = a.expDate || '9999/99/99';
            const expB = b.expDate || '9999/99/99';
            if (expA !== expB) return expA.localeCompare(expB);
            
            if (a.regDate !== b.regDate) return a.regDate.localeCompare(b.regDate);
            
            return a.name.localeCompare(b.name);
        });

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'list-item';
            
            const displayExpDate = item.expDate ? item.expDate : 'なし';
            
            div.innerHTML = `
                <div class="col-name">${escapeHTML(item.name)}</div>
                <div class="col-exp">${displayExpDate}</div>
                <div class="col-reg">${item.regDate}</div>
                <div class="col-check">
                    <input type="checkbox" class="item-checkbox" value="${item.id}">
                </div>
            `;
            listContainer.appendChild(div);
        });
    }

    // 登録処理
    function registerItem() {
        const nameInput = document.getElementById('input-name').value.trim();
        const expInputRaw = document.getElementById('input-exp').value;
        
        if (!nameInput) {
            alert('エラー：品名を入力してください。');
            return;
        }

        const expDateFormatted = expInputRaw ? expInputRaw.replace(/-/g, '/') : '';
        const newItem = {
            id: Date.now().toString(),
            name: nameInput,
            expDate: expDateFormatted,
            regDate: getTodayString()
        };

        // 在庫リストへ追加
        const items = loadData();
        items.push(newItem);
        saveData(items);

        // 品名を履歴へ追加
        saveNameHistory(nameInput);
        
        alert('食品を登録しました');
    }

    // 削除処理
    function deleteSelected() {
        const checkboxes = document.querySelectorAll('.item-checkbox:checked');
        if (checkboxes.length === 0) {
            alert('削除する食品が選択されていません。');
            return;
        }

        if (confirm('選択した食品を削除しますか？')) {
            const idsToDelete = Array.from(checkboxes).map(cb => cb.value);
            let items = loadData();
            items = items.filter(item => !idsToDelete.includes(item.id));
            saveData(items);
            renderList();
        }
    }

    // XSS対策用エスケープ
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }

    // 初期化処理
    window.onload = () => {
        renderList();
        updateDatalist(); // 起動時に履歴リストを読み込む
    };
</script>

</body>
</html>
