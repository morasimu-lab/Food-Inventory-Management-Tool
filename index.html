<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>家庭用在庫管理ツール</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="app-container">
    <!-- メインナビゲーション（食品 / 日用品 / 買い物リスト） -->
    <div class="main-nav">
        <button class="btn-outline" id="nav-food" onclick="switchTab('food')">食品</button>
        <button class="btn-outline" id="nav-goods" onclick="switchTab('goods')">日用品</button>
        <button class="btn-outline" id="nav-shopping" onclick="switchTab('shopping')">買い物リスト</button>
    </div>

    <!-- 食品タブ -->
    <div id="tab-food" class="tab-content"></div>

    <!-- 日用品タブ -->
    <div id="tab-goods" class="tab-content"></div>

    <!-- 買い物リストタブ -->
    <div id="tab-shopping" class="tab-content"></div>
</div>

<!-- エントリーポイントの読み込み -->
<script type="module" src="./js/main.js"></script>
</body>
</html>
